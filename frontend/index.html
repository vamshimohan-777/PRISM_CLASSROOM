      <main style="max-width:48rem;margin:0 auto;padding:2rem 1rem;font-family:Georgia,serif;line-height:1.6">
        <h1>PRISM Classroom</h1>
        <p><strong>Misconception-aware adaptive learning that keeps teachers at the centre.</strong>
           CBSE Class VIII Mathematics, NCERT-aligned.</p>
        <p>PRISM diagnoses <em>why</em> a learner answered incorrectly rather than only marking the
           answer wrong. Short diagnostic items classify the underlying misconception, a deterministic
           rules engine over a validated prerequisite concept graph selects a learning route, and the
           evidence is compiled into small-group intervention pods that the teacher approves or edits.</p>
        <h2>How a learner is routed</h2>
        <ul>
          <li><strong>Foundation</strong> — a prerequisite concept is measurably weak, so scaffolding comes first.</li>
          <li><strong>Visual support</strong> — one error pattern dominates, so the representation changes.</li>
          <li><strong>Guided practice</strong> — the signal is not yet clear enough to label.</li>
          <li><strong>Follow-up</strong> — evidence is mixed; the teacher asks one discriminating question.</li>
          <li><strong>Extension</strong> — an unassisted transfer item was passed at high mastery.</li>
        </ul>
        <p>A single wrong answer never establishes a misconception label.</p>
